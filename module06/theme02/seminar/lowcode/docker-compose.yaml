services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    # ports:
    #   - "5432:5432"
    volumes:
      - ./postgres_langflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    network_mode: host

  langflow-migration:
    image: langflowai/langflow:1.6.9
    depends_on:
      postgres:
        condition: service_healthy
    command: ["langflow", "migration"]
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@localhost:5432/langflow
    network_mode: host

  langflow:
    image: langflowai/langflow:1.6.9
    ports:
      - "7860:7860"
    depends_on:
      langflow-migration:
        condition: service_completed_successfully
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@localhost:5432/langflow
      LANGFLOW_CONFIG_DIR: /app/config
    volumes:
      # https://github.com/langflow-ai/langflow/issues/7683#issuecomment-3460222778
      - ./langflow_configs:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    network_mode: host

